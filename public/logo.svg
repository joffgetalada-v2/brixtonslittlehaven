<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef6351"/>
      <stop offset="20%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9f0"/>
      <stop offset="100%" stop-color="#fde8d8"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>
  <!-- Rainbow ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#ring)" stroke-width="12"/>
  <!-- Inner decoration circles -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="#1a2744" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.2"/>
  <!-- Star dots -->
  <circle cx="100" cy="20" r="4" fill="#fbbf24"/>
  <circle cx="164" cy="56" r="3" fill="#ef6351"/>
  <circle cx="164" cy="144" r="3" fill="#22c55e"/>
  <circle cx="100" cy="180" r="4" fill="#38bdf8"/>
  <circle cx="36" cy="144" r="3" fill="#a855f7"/>
  <circle cx="36" cy="56" r="3" fill="#f97316"/>
  <!-- Initials -->
  <text x="100" y="96" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="800" font-size="38" text-anchor="middle" fill="#1a2744" letter-spacing="2">BLH</text>
  <!-- Tagline -->
  <text x="100" y="118" font-family="Arial, sans-serif" font-weight="600" font-size="9" text-anchor="middle" fill="#1a2744" letter-spacing="3" opacity="0.7">LITTLE HAVEN</text>
</svg>
